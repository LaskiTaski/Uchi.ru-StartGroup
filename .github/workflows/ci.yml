name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Проверка данных
        run: python tools/validate.py

      - name: Проверка поискового индекса
        run: python tools/build_search_index.py --check

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Установка зависимостей
        run: npm install

      - name: Сквозной тест интерфейса
        run: node tools/e2e.mjs

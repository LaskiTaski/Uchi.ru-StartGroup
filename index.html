<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Academy — Учебная платформа</title>
  <meta name="description" content="Python Academy — учебная платформа: видеомодули, справочники по Python, курсы и песочница с автопроверкой заданий прямо в браузере">
  <meta property="og:title" content="Python Academy — Учебная платформа">
  <meta property="og:description" content="Python Academy — учебная платформа: видеомодули, справочники по Python, курсы и песочница с автопроверкой заданий прямо в браузере">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ru_RU">
  <meta name="theme-color" content="#0B0E16">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23E86B2A'/%3E%3Cstop offset='1' stop-color='%23F59E0B'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='43' font-family='JetBrains Mono,monospace' font-size='26' font-weight='800' fill='%23fff' text-anchor='middle'%3EPy%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<a class="skip-link" href="#content">К содержимому</a>

<!-- Лайтбокс -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Скриншот">
  <button class="lightbox-close" aria-label="Закрыть">✕</button>
  <img src="" alt="Скриншот">
</div>

<!-- Шапка -->
<header class="header">
  <div class="header-inner">
    <div class="header-top">
      <!-- Виден только на узком экране (styles.css) — на широком панель слева и так открыта -->
      <button class="rail-toggle" id="rail-toggle" type="button" aria-expanded="false" aria-controls="rail">☰ Меню</button>
      <div class="logo">
        <div class="logo-icon">Py</div>
        <div>
          <div class="logo-text">Python Academy</div>
          <div class="logo-sub">Учебная платформа</div>
        </div>
      </div>
      <div class="search-box" id="search-box">
        <span class="search-icon">🔍</span>
        <input type="search" id="search-input" class="search-input"
               role="combobox" aria-autocomplete="list" aria-haspopup="listbox"
               aria-controls="search-results" aria-expanded="false"
               placeholder="Поиск по материалам" autocomplete="off" spellcheck="false">
        <kbd class="search-hint">/</kbd>
        <div class="search-results" id="search-results" role="listbox"></div>
      </div>
      <div class="contacts">
        <a class="contact-badge support" href="https://t.me/UchiDomaSupport_U2035_bot" target="_blank" rel="noopener">
          🐱‍💻 Тех. поддержка
        </a>
        <a class="contact-badge teacher" href="https://t.me/Tim_Dev_13" target="_blank" rel="noopener">
          👨‍🏫 @Tim_Dev_13
        </a>
      </div>
    </div>
  </div>
</header>

<!-- Затемнение позади выезжающей панели на узком экране, закрывает её кликом мимо -->
<div class="rail-scrim" id="rail-scrim" aria-hidden="true"></div>

<div class="layout">
  <!-- Постоянная панель материалов слева (app.js → renderRail) -->
  <aside class="rail" id="rail"></aside>

  <!-- Контент -->
  <main class="content" id="content" tabindex="-1"></main>
</div>

<!-- Подвал -->
<footer class="footer">
  Python Academy © 2026 • Все материалы предоставлены для учебных целей
</footer>

<script src="sandbox.js"></script>
<script src="app.js"></script>
</body>
</html>

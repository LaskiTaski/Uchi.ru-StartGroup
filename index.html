<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Academy — Учебная платформа</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<a class="skip-link" href="#content">К содержимому</a>

<!-- Лайтбокс -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Скриншот">
  <button class="lightbox-close" aria-label="Закрыть">✕</button>
  <img src="" alt="Скриншот">
</div>

<!-- Шапка -->
<header class="header">
  <div class="header-inner">
    <div class="header-top">
      <div class="logo">
        <div class="logo-icon">Py</div>
        <div>
          <div class="logo-text">Python Academy</div>
          <div class="logo-sub">Учебная платформа</div>
        </div>
      </div>
      <div class="search-box" id="search-box">
        <span class="search-icon">🔍</span>
        <input type="search" id="search-input" class="search-input"
               role="combobox" aria-autocomplete="list" aria-haspopup="listbox"
               aria-controls="search-results" aria-expanded="false"
               placeholder="Поиск по материалам" autocomplete="off" spellcheck="false">
        <kbd class="search-hint">/</kbd>
        <div class="search-results" id="search-results" role="listbox"></div>
      </div>
      <div class="contacts">
        <a class="contact-badge support" href="https://t.me/UchiDomaSupport_U2035_bot" target="_blank" rel="noopener">
          🐱‍💻 Тех. поддержка
        </a>
        <a class="contact-badge teacher" href="https://t.me/Tim_Dev_13" target="_blank" rel="noopener">
          👨‍🏫 @Tim_Dev_13
        </a>
      </div>
    </div>
    <div class="nav-primary-wrap" id="groups-wrap">
      <nav class="nav-primary" id="groups" role="tablist"></nav>
    </div>
    <div class="tabs-wrap" id="tabs-wrap">
      <button class="tabs-arrow left" id="tabs-prev" type="button" aria-label="Прокрутить влево">‹</button>
      <nav class="tabs" id="tabs" role="tablist"></nav>
      <button class="tabs-arrow right" id="tabs-next" type="button" aria-label="Прокрутить вправо">›</button>
    </div>
  </div>
</header>

<!-- Контент -->
<main class="content" id="content" role="tabpanel" tabindex="-1"></main>

<!-- Подвал -->
<footer class="footer">
  Python Academy © 2026 • Все материалы предоставлены для учебных целей
</footer>

<script src="sandbox.js"></script>
<script src="app.js"></script>
</body>
</html>
